<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMI Radio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player {
            width: 100%;
            max-width: 900px;
            background: #181818;
            border-radius: 20px;
            padding: 28px 32px;
            display: flex;
            gap: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cover {
            flex-shrink: 0;
            width: 260px;
            height: 260px;
            border-radius: 16px;
            background: linear-gradient(135deg, #1DB954 0%, #0d7a34 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .cover::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), transparent 60%);
        }
        .cover-icon { font-size: 3.5rem; margin-bottom: 8px; position: relative; z-index: 1; }
        .cover-title {
            font-size: 1.8rem; font-weight: 800; letter-spacing: 2px;
            position: relative; z-index: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .cover-subtitle {
            font-size: 0.75rem; letter-spacing: 4px; opacity: 0.85;
            margin-top: 4px; position: relative; z-index: 1;
        }

        .live-dot {
            position: absolute; top: 16px; left: 16px;
            display: flex; align-items: center; gap: 6px;
            background: rgba(0,0,0,0.4); padding: 4px 10px;
            border-radius: 20px; font-size: 0.7rem;
            font-weight: 700; letter-spacing: 1px; z-index: 2;
        }
        .live-dot span {
            width: 8px; height: 8px; background: #ff3b3b;
            border-radius: 50%; animation: pulse 1.4s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .info {
            flex: 1; display: flex; flex-direction: column;
            justify-content: space-between; min-width: 0;
        }

        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .header-left .label { font-size: 0.85rem; color: #888; margin-bottom: 4px; }
        .header-left h2 { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
        .header-left p { font-size: 0.85rem; color: #aaa; margin-top: 4px; }

        .status-badge {
            background: rgba(29, 185, 84, 0.15); color: #1DB954;
            padding: 6px 14px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 600;
            letter-spacing: 0.5px; white-space: nowrap;
        }
        .status-badge.error { background: rgba(255, 59, 59, 0.15); color: #ff3b3b; }
        .status-badge.connecting { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }

        .visualizer-wrap {
            margin: 20px 0; height: 60px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px; padding: 8px; overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }

        .controls {
            display: flex; align-items: center; justify-content: center;
            gap: 24px; margin-bottom: 16px;
        }
        .btn-round {
            background: rgba(255, 255, 255, 0.08); border: none; color: #fff;
            width: 52px; height: 52px; border-radius: 50%; cursor: pointer;
            font-size: 1.2rem; display: flex; align-items: center;
            justify-content: center; transition: all 0.2s;
        }
        .btn-round:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15); transform: scale(1.05);
        }
        .btn-round:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-play {
            width: 68px; height: 68px; background: #1DB954; font-size: 1.5rem;
        }
        .btn-play:hover:not(:disabled) {
            background: #1ed760; transform: scale(1.08);
        }

        .volume-row {
            display: flex; align-items: center; gap: 12px;
            padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .volume-row .val { font-size: 0.8rem; color: #888; min-width: 28px; }
        .volume-row .icon { font-size: 1rem; color: #1DB954; }
        input[type="range"] { flex: 1; accent-color: #1DB954; height: 4px; }

        @media (max-width: 720px) {
            .player { flex-direction: column; padding: 20px; }
            .cover { width: 100%; height: 200px; }
        }
    </style>
</head>
<body>

    <div class="player">
        <div class="cover">
            <div class="live-dot"><span></span>LIVE</div>
            <div class="cover-icon">📻</div>
            <div class="cover-title">DMI</div>
            <div class="cover-subtitle">RADIO</div>
        </div>

        <div class="info">
            <div class="header">
                <div class="header-left">
                    <div class="label">🎵 Music</div>
                    <h2>DMI Radio — Live Stream</h2>
                    <p id="trackInfo">Ожидание подключения...</p>
                </div>
                <div class="status-badge connecting" id="statusBadge">Подключение</div>
            </div>

            <div class="visualizer-wrap">
                <canvas id="visualizer"></canvas>
            </div>

            <div class="controls">
                <button class="btn-round" id="rewindBtn" disabled>⏮</button>
                <button class="btn-round btn-play" id="playPauseBtn" disabled>▶</button>
                <button class="btn-round" id="forwardBtn" disabled>⏭</button>
            </div>

            <div class="volume-row">
                <span class="val">75</span>
                <span class="icon">🔊</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="75">
            </div>
        </div>

        <audio id="remoteAudio" autoplay></audio>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <script>
        // ============ КОНФИГ ============
        const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
        const TOPIC_PREFIX = 'audio/my_pc_001';

        // Генерируем уникальный ID для этого клиента
        const CLIENT_ID = 'c_' + Math.random().toString(36).slice(2, 10)
                          + '_' + Date.now().toString(36);

        const TOPIC_OFFER  = `${TOPIC_PREFIX}/offer/${CLIENT_ID}`;
        const TOPIC_ANSWER = `${TOPIC_PREFIX}/answer/${CLIENT_ID}`;

        console.log('Client ID:', CLIENT_ID);

        // ============ ЭЛЕМЕНТЫ ============
        const remoteAudio = document.getElementById('remoteAudio');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const rewindBtn = document.getElementById('rewindBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeVal = document.querySelector('.volume-row .val');
        const statusBadge = document.getElementById('statusBadge');
        const trackInfo = document.getElementById('trackInfo');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        // ============ СОСТОЯНИЕ ============
        let pc = null;
        let mqttClient = null;
        let audioContext = null;
        let analyser = null;
        let animationId = null;
        let offerSent = false;

        function setStatus(text, type = 'connecting') {
            statusBadge.textContent = text;
            statusBadge.className = 'status-badge ' + type;
        }

        // ============ MQTT ============
        function connectMQTT() {
            return new Promise((resolve, reject) => {
                mqttClient = mqtt.connect(MQTT_BROKER, {
                    clientId: 'dmi_' + CLIENT_ID,
                    clean: true,
                    connectTimeout: 10000,
                    reconnectPeriod: 3000,
                });

                mqttClient.on('connect', () => {
                    setStatus('MQTT OK', 'connecting');
                    mqttClient.subscribe(TOPIC_ANSWER, (err) => {
                        if (err) reject(err);
                        else resolve();
                    });
                });

                mqttClient.on('error', (err) => {
                    setStatus('MQTT Error', 'error');
                    trackInfo.textContent = 'Ошибка MQTT: ' + err.message;
                    reject(err);
                });

                mqttClient.on('message', async (topic, payload) => {
                    if (topic !== TOPIC_ANSWER) return;
                    try {
                        const data = JSON.parse(payload.toString());
                        if (data.type === 'answer' && pc) {
                            await pc.setRemoteDescription(
                                new RTCSessionDescription(data)
                            );
                            setStatus('LIVE', '');
                            trackInfo.textContent = 'Трансляция с ПК';
                        }
                    } catch (e) {
                        console.error('Ошибка answer:', e);
                    }
                });
            });
        }

        // ============ WEBRTC ============
        async function initWebRTC() {
            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
            });

            pc.ontrack = (event) => {
                if (event.track.kind === 'audio') {
                    remoteAudio.srcObject = event.streams[0];
                    remoteAudio.volume = volumeSlider.value / 100;

                    playPauseBtn.disabled = false;
                    rewindBtn.disabled = false;
                    forwardBtn.disabled = false;

                    initVisualizer(event.streams[0]);

                    remoteAudio.play().then(() => {
                        playPauseBtn.textContent = '⏸';
                    }).catch(() => {
                        playPauseBtn.textContent = '▶';
                        setStatus('Нажмите ▶', 'connecting');
                    });
                }
            };

            pc.oniceconnectionstatechange = () => {
                console.log('ICE:', pc.iceConnectionState);
                if (pc.iceConnectionState === 'failed') {
                    setStatus('ICE Failed', 'error');
                    trackInfo.textContent = 'Не удалось установить соединение';
                }
            };

            const offer = await pc.createOffer({
                offerToReceiveAudio: true,
                offerToReceiveVideo: false,
            });
            await pc.setLocalDescription(offer);

            if (!offerSent) {
                offerSent = true;
                mqttClient.publish(TOPIC_OFFER, JSON.stringify({
                    type: 'offer',
                    sdp: pc.localDescription.sdp,
                }));
                setStatus('Ожидание...', 'connecting');
            }
        }

        // ============ ВИЗУАЛИЗАТОР ============
        function initVisualizer(stream) {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 128;

            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);
            drawVisualizer();
        }

        function drawVisualizer() {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                animationId = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);

                const w = canvas.width;
                const h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                const barWidth = (w / bufferLength) * 2.5;
                let x = 0;
                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * h;
                    const gradient = ctx.createLinearGradient(0, h - barHeight, 0, h);
                    gradient.addColorStop(0, '#1DB954');
                    gradient.addColorStop(1, '#0d7a34');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(x, h - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            }
            draw();
        }

        // ============ УПРАВЛЕНИЕ ============
        playPauseBtn.addEventListener('click', async () => {
            if (remoteAudio.paused) {
                await remoteAudio.play();
                playPauseBtn.textContent = '⏸';
            } else {
                remoteAudio.pause();
                playPauseBtn.textContent = '▶';
            }
        });
        rewindBtn.addEventListener('click', () => { remoteAudio.currentTime = 0; });
        forwardBtn.addEventListener('click', () => console.log('Live — forward недоступен'));

        volumeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            remoteAudio.volume = val / 100;
            volumeVal.textContent = val;
        });

        // ============ CANVAS ============
        function resizeCanvas() {
            canvas.width = canvas.clientWidth * 2;
            canvas.height = canvas.clientHeight * 2;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ============ СТАРТ ============
        async function start() {
            try {
                setStatus('Подключение...', 'connecting');
                trackInfo.textContent = 'Соединение с ПК...';
                await connectMQTT();
                await initWebRTC();
            } catch (err) {
                console.error(err);
                setStatus('Ошибка', 'error');
                trackInfo.textContent = err.message;
            }
        }

        window.addEventListener('beforeunload', () => {
            if (animationId) cancelAnimationFrame(animationId);
            if (pc) pc.close();
            if (mqttClient) mqttClient.end();
            if (audioContext) audioContext.close();
        });

        start();
    </script>
</body>
</html>
